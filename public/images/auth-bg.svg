<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <!-- brand navy field: brand-900 -> brand-600 -> brand-800 -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#081833"/>
      <stop offset="0.48" stop-color="#123068"/>
      <stop offset="1"    stop-color="#0d244e"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3f68af" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3f68af" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6f96d1" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#6f96d1" stop-opacity="0"/>
    </radialGradient>

    <!-- darkens the middle so the centered card always reads -->
    <radialGradient id="vignette" cx="50%" cy="48%" r="62%">
      <stop offset="0"    stop-color="#050f22" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#050f22" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#050f22" stop-opacity="0.72"/>
    </radialGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <circle cx="230"  cy="140" r="480" fill="url(#glowA)"/>
  <circle cx="1420" cy="260" r="520" fill="url(#glowB)"/>
  <circle cx="1220" cy="960" r="420" fill="url(#glowA)"/>

  <!-- ── workspace motif: coworking floor plan (rooms, desks, seats) ── -->
  <g stroke="#ffffff" stroke-opacity="0.13" fill="none" stroke-width="1.4">
    <!-- meeting room -->
    <rect x="96" y="560" width="250" height="170" rx="10"/>
    <rect x="150" y="618" width="142" height="54" rx="8" stroke-opacity="0.09"/>
    <!-- shared / open area -->
    <rect x="372" y="560" width="196" height="170" rx="10"/>
    <line x1="372" y1="645" x2="568" y2="645" stroke-opacity="0.07"/>
    <!-- private offices -->
    <rect x="96"  y="756" width="146" height="126" rx="10"/>
    <rect x="268" y="756" width="146" height="126" rx="10"/>
    <rect x="440" y="756" width="128" height="126" rx="10"/>
  </g>
  <g fill="#6f96d1" fill-opacity="0.34">
    <!-- seats around the meeting table -->
    <circle cx="176" cy="600" r="6"/><circle cx="221" cy="600" r="6"/><circle cx="266" cy="600" r="6"/>
    <circle cx="176" cy="690" r="6"/><circle cx="221" cy="690" r="6"/><circle cx="266" cy="690" r="6"/>
    <!-- open-area seats -->
    <circle cx="422" cy="602" r="6"/><circle cx="470" cy="602" r="6"/><circle cx="518" cy="602" r="6"/>
    <circle cx="422" cy="688" r="6"/><circle cx="470" cy="688" r="6"/><circle cx="518" cy="688" r="6"/>
    <!-- office desks -->
    <circle cx="169" cy="819" r="6"/><circle cx="341" cy="819" r="6"/><circle cx="504" cy="819" r="6"/>
  </g>

  <!-- ── hotspot motif: router broadcasting to connected clients ── -->
  <g transform="translate(1210 250)">
    <g stroke="#88a6d8" fill="none" stroke-linecap="round" stroke-opacity="0.30">
      <path d="M-52 -22 A 72 72 0 0 1 52 -22" stroke-width="3"/>
      <path d="M-88 -52 A 124 124 0 0 1 88 -52" stroke-width="2.6" stroke-opacity="0.22"/>
      <path d="M-124 -82 A 176 176 0 0 1 124 -82" stroke-width="2.2" stroke-opacity="0.14"/>
    </g>
    <rect x="-34" y="8" width="68" height="22" rx="7" fill="#6f96d1" fill-opacity="0.40"/>
    <circle cx="0" cy="-2" r="7" fill="#b0c6e6" fill-opacity="0.55"/>
  </g>

  <!-- ── network mesh: sessions linked across the space ── -->
  <g stroke="#88a6d8" stroke-opacity="0.20" stroke-width="1.3" fill="none">
    <path d="M1210 280 L1050 430 L1180 580 L1360 470 Z"/>
    <path d="M1050 430 L880 372"/>
    <path d="M1180 580 L1078 760"/>
    <path d="M1360 470 L1494 604"/>
    <path d="M880 372 L742 214"/>
    <path d="M1078 760 L1268 838"/>
    <path d="M742 214 L560 158 L410 268"/>
    <path d="M560 158 L648 340"/>
  </g>
  <g fill="#b0c6e6" fill-opacity="0.42">
    <circle cx="1050" cy="430" r="5.5"/>
    <circle cx="1180" cy="580" r="5"/>
    <circle cx="1360" cy="470" r="5"/>
    <circle cx="880"  cy="372" r="4.5"/>
    <circle cx="1078" cy="760" r="4.5"/>
    <circle cx="1494" cy="604" r="4"/>
    <circle cx="1268" cy="838" r="4"/>
    <circle cx="742"  cy="214" r="4.5"/>
    <circle cx="560"  cy="158" r="5"/>
    <circle cx="410"  cy="268" r="4"/>
    <circle cx="648"  cy="340" r="4"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
